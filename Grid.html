<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-columns: 150px 150px 150px 150px;
            grid-template-rows: 150px 150px 150px 150px ;
            grid-template-areas:
            "Gujarat Gujarat madhyaPardesh madhyaPardesh "
            "Gujarat Gujarat madhyaPardesh madhyaPardesh "
            "Rajasthan Rajasthan Rajasthan Rajasthan "
            "Bihar Bihar UttarPradesh UttarPradesh ";
            gap: 10px;

        }
        .item1{
            grid-area: Gujarat;
            background-color: #a481ef;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item2{
            grid-area: madhyaPardesh;
            background-color:rgb(209, 114, 114);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item3{
            grid-area: Rajasthan;
            background-color: #b78fbd;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item4{
            grid-area: Bihar;
            background-color:rgb(235, 235, 148);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .item5{
            grid-area: UttarPradesh;
            background-color: rgb(249, 128, 128);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        </style>
</head>
<body>
    <div class="cont">
        <div class="item1"style="font-size: 30px;">Gujarat</div>
        <div class="item2"style="font-size: 30px;">Madhya Pradesh</div>
        <div class="item3"style="font-size: 30px;">Rajasthan</div>
        <div class="item4"style="font-size: 30px;">Bihar</div>
        <div class="item5"style="font-size: 30px;">Uttar Pradesh</div>
    </div>
</body>
</html>
